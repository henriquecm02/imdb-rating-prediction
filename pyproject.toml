[project]
name = "filmeagent"
version = "1.0.0"
description = "Agente de filmes do IMDb: consulta, previsão de nota e gênero pela sinopse, com dashboard e avaliação contra gabarito."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", 
  "plotly>=5.20", "joblib>=1.3", "streamlit>=1.51", "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
extend-exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
